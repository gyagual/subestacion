<script>
    function registrarUsuario() {
        var nombres = document.getElementById('nombres').value.trim();
        var apellidos = document.getElementById('apellidos').value.trim();
        var departamento = document.getElementById('departamento').value.trim();
        var codigoTrabajo = document.getElementById('codigoTrabajo').value.trim();
        var correo = document.getElementById('correo').value.trim();
        var password = document.getElementById('password').value.trim();
        var errorDiv = document.getElementById('error-msg');

        if (nombres && apellidos && departamento && codigoTrabajo && correo && password) {

            fetch("https://script.google.com/macros/s/AKfycbyeTGd5KrYhcQA8CkkDULG5VMSRC8YK8cVM_PE_ysOBbYtbD4lAb9cOslRImE-lc27A/exec", {
                method: "POST",
                body: JSON.stringify({
                    Nombres: nombres,
                    Apellidos: apellidos,
                    Departamento: departamento,
                    CódigoTrabajo: codigoTrabajo,
                    Correo: correo,
                    Contraseña: password
                }),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(res => res.text())
            .then(response => {
                if (response.includes("OK")) {
                    alert("✅ Registro exitoso.");
                    // Limpiar campos
                    document.getElementById('nombres').value = "";
                    document.getElementById('apellidos').value = "";
                    document.getElementById('departamento').value = "";
                    document.getElementById('codigoTrabajo').value = "";
                    document.getElementById('correo').value = "";
                    document.getElementById('password').value = "";

                    // Redirigir después de un breve tiempo
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    errorDiv.innerHTML = "❌ Error al registrar: " + response;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                errorDiv.innerHTML = "❌ Error en el servidor.";
            });

        } else {
            errorDiv.innerHTML = "⚠️ Por favor, complete todos los campos.";
        }
    }
</script>
