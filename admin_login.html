<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Usuario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
    }
    .register-container input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .register-container button {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .success {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>Registro de Usuario</h1>
    <input type="text" id="nombres" placeholder="Nombres" required>
    <input type="text" id="apellidos" placeholder="Apellidos" required>
    <input type="text" id="departamento" placeholder="Departamento" required>
    <input type="text" id="codigoTrabajo" placeholder="Código de trabajo" required>
    <input type="email" id="correo" placeholder="Correo Institucional" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button onclick="registrarUsuario()">Registrar</button>
    <div id="mensaje" class="error"></div>
  </div>

  <script>
    function registrarUsuario() {
      const nombres = document.getElementById("nombres").value.trim();
      const apellidos = document.getElementById("apellidos").value.trim();
      const departamento = document.getElementById("departamento").value.trim();
      const codigoTrabajo = document.getElementById("codigoTrabajo").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();
      const mensajeDiv = document.getElementById("mensaje");

      mensajeDiv.className = "error"; // Por defecto

      if (nombres && apellidos && departamento && codigoTrabajo && correo && password) {
        fetch("https://script.google.com/macros/s/AKfycbwt-4dthxgssKrhsjkq2xYlivLc0BmbbPEwEJa8evhoR2XoOf_qL1G5gguttg7D2YM/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            Nombres: nombres,
            Apellidos: apellidos,
            Departamento: departamento,
            CódigoTrabajo: codigoTrabajo,
            Correo: correo,
            Contraseña: password
          })
        })
        .then(response => response.text())
        .then(data => {
          if (data === "OK") {
            mensajeDiv.className = "success";
            mensajeDiv.innerHTML = "✅ Registro exitoso. Redirigiendo...";

            // Limpiar campos
            document.getElementById("nombres").value = "";
            document.getElementById("apellidos").value = "";
            document.getElementById("departamento").value = "";
            document.getElementById("codigoTrabajo").value = "";
            document.getElementById("correo").value = "";
            document.getElementById("password").value = "";

            // Redireccionar después de unos segundos
            setTimeout(() => {
              window.location.href = "admin_login.html";
            }, 1500);
          } else {
            mensajeDiv.innerHTML = "❌ Error: " + data;
          }
        })
        .catch(error => {
          console.error("Error:", error);
          mensajeDiv.innerHTML = "❌ No se pudo conectar con el servidor.";
        });
      } else {
        mensajeDiv.innerHTML = "⚠️ Por favor, complete todos los campos.";
      }
    }
  </script>
</body>
</html>
