<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Usuario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
    }
    .register-container input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .register-container button {
      background-color: #004080;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>Registro de Usuario</h1>
    <input type="text" id="nombres" placeholder="Nombres" required>
    <input type="text" id="apellidos" placeholder="Apellidos" required>
    <input type="text" id="departamento" placeholder="Departamento" required>
    <input type="text" id="codigoTrabajo" placeholder="Código de trabajo" required>
    <input type="email" id="correo" placeholder="Correo Institucional" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button onclick="registrarUsuario()">Registrar</button>
    <div id="error-msg" class="error"></div>
  </div>

  <script>
    function registrarUsuario() {
      const nombres = document.getElementById("nombres").value;
      const apellidos = document.getElementById("apellidos").value;
      const departamento = document.getElementById("departamento").value;
      const codigoTrabajo = document.getElementById("codigoTrabajo").value;
      const correo = document.getElementById("correo").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error-msg");

      if (nombres && apellidos && departamento && codigoTrabajo && correo && password) {
        fetch("https://script.google.com/macros/s/AKfycbyeTGd5KrYhcQA8CkkDULG5VMSRC8YK8cVM_PE_ysOBbYtbD4lAb9cOslRImE-lc27A/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            Nombres: nombres,
            Apellidos: apellidos,
            Departamento: departamento,
            CódigoTrabajo: codigoTrabajo,
            Correo: correo,
            Contraseña: password
          })
        })
        .then(response => response.text())
        .then(data => {
          alert("✅ Solicitud enviada al administrador.");
          window.location.href = "admin_login.html"; // Redirecciona si deseas
        })
        .catch(error => {
          console.error("Error:", error);
          errorDiv.innerHTML = "❌ Error al enviar el registro.";
        });
      } else {
        errorDiv.innerHTML = "⚠️ Por favor, complete todos los campos.";
      }
    }
  </script>
</body>
</html>
